<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebase Vault – which project lives where</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#eceff4;--muted:#8d95a6;
  --accent:#ffb02e;--accent-ink:#1a1200;--danger:#ff5d5d;--r:16px;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f5f3ee;--panel:#fff;--panel2:#f0ede6;--line:#e0dcd2;--text:#1c1d21;--muted:#6b6f7a}
}
:root[data-theme="light"]{--bg:#f5f3ee;--panel:#fff;--panel2:#f0ede6;--line:#e0dcd2;--text:#1c1d21;--muted:#6b6f7a}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;letter-spacing:-.02em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

.btn{border:1px solid var(--line);background:var(--panel2);padding:9px 16px;border-radius:12px;font-weight:600;transition:.15s;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.icon{width:34px;height:34px;padding:0;border-radius:10px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:70px}

/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:410px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px 28px}
.auth-card h1{font-size:34px;line-height:1.05;margin-bottom:8px}
.auth-card p.sub{color:var(--muted)}
.auth-card .btn{width:100%;margin-top:18px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin-top:18px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.switch{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
.switch a{color:var(--accent);cursor:pointer;font-weight:600}
.err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}

/* shell */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;white-space:nowrap}
.logo span{color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;margin-right:auto;margin-left:14px}
.tab{border:0;background:none;padding:6px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.who{color:var(--muted);font-size:13px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1240px;margin:auto;padding:26px 20px 90px}
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between;margin-bottom:22px}
.head h2{font-size:clamp(26px,4vw,40px);line-height:1.05}
.head p{color:var(--muted);margin-top:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap;width:100%;max-width:560px}
.tools input{flex:1;min-width:180px}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.stat small{color:var(--muted)}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:42px;line-height:1.1;margin-top:4px}
.stat.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.hl small{color:inherit;opacity:.75}
.dash{display:grid;grid-template-columns:3fr 2fr;gap:18px}
@media(max-width:900px){.dash{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font-size:18px;margin-bottom:14px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(90px,170px) 1fr 28px;gap:12px;align-items:center;font-size:13px;cursor:pointer}
.bar-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{background:var(--panel2);border-radius:99px;height:12px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .5s}
.bar-row b{text-align:right}
.dup{display:flex;flex-direction:column;gap:10px}
.dup-item{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:13px}
.dup-item b{font-size:14px}
.dup-item div{color:var(--muted);word-break:break-all;margin-top:2px}
.recent{margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border-radius:10px;padding:6px 11px;font-size:13px;display:flex;gap:8px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip code{color:var(--muted);font-size:12px}

/* accounts */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:18px}
.acc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:90px}
.acc.flash{border-color:var(--accent)}
.acc-head{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;color:#10131a;font-size:18px}
.acc-head .t{flex:1;min-width:0}
.acc-head h3{font-size:16px;word-break:break-all}
.acc-head small{color:var(--muted)}
.acc-actions{display:flex;gap:6px}
.note{color:var(--muted);font-size:13px;background:var(--panel2);padding:8px 12px;border-radius:10px}
.projs{display:flex;flex-direction:column;gap:8px}
.proj{background:var(--panel2);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.proj .pi{flex:1;min-width:0}
.proj b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj code{font-size:12.5px;color:var(--muted);word-break:break-all}
.proj .pn{font-size:12.5px;color:var(--muted)}
.proj .pa{display:flex;gap:2px;flex:none}
.proj .btn.icon{width:30px;height:30px;border-radius:8px;background:transparent;border-color:transparent;color:var(--muted)}
.proj .btn.icon:hover{color:var(--text);border-color:var(--line)}
.empty{text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty h3{color:var(--text);font-size:22px;margin-bottom:6px}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:2px 9px;border-radius:99px}

/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px;width:100%;max-width:460px;padding:26px;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.sheet h3{font-size:22px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:99;transition:.25s;opacity:0;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:640px){.who{display:none}.bar{padding:10px 12px;flex-wrap:wrap}.tabs{margin-left:0;order:3;width:100%}.tab{flex:1}main{padding:20px 14px 80px}.head .btn{width:100%}.stat b{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="auth">
  <div class="auth-card">
    <h1>Firebase<br>Vault</h1>
    <p class="sub">Know which project lives in which Firebase account.</p>
    <button class="btn" id="googleBtn" type="button">Continue with Google</button>
    <div class="divider">or use email</div>
    <label for="em">Email</label><input id="em" type="email" autocomplete="email">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="authErr"></div>
    <button class="btn primary" id="authBtn" type="button" style="margin-top:0">Log in</button>
    <div class="switch"><span id="swTxt">New here?</span> <a id="swLink" tabindex="0">Create an account</a></div>
  </div>
</section>

<div id="app" class="hidden">
  <header><div class="bar">
    <div class="logo">Firebase<span>Vault</span></div>
    <div class="tabs">
      <button class="tab on" data-tab="dash" type="button">Dashboard</button>
      <button class="tab" data-tab="accs" type="button">Accounts</button>
    </div>
    <span class="who" id="who"></span>
    <button class="btn sm" id="themeBtn" type="button">Theme</button>
    <button class="btn sm" id="outBtn" type="button">Log out</button>
  </div></header>
  <main>
    <section id="dash">
      <div class="head"><div><h2>Dashboard</h2><p>Everything you've built, across every Firebase account.</p></div></div>
      <div class="stats" id="stats"></div>
      <div class="dash">
        <div class="card"><h3>Projects per account</h3><div class="bars" id="bars"></div></div>
        <div class="card"><h3>Same name, different accounts</h3><div class="dup" id="dups"></div></div>
      </div>
      <div class="card recent"><h3>All projects</h3><div class="chips" id="chips"></div></div>
    </section>
    <section id="accs" class="hidden">
      <div class="head">
        <div><h2>Accounts &amp; projects</h2><p id="count"></p></div>
        <div class="tools">
          <input id="q" type="search" placeholder="Search account, project or ID…" aria-label="Search">
          <button class="btn primary" id="addAcc" type="button">+ Add account</button>
        </div>
      </div>
      <div id="list" class="grid"></div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCU-DMS61iGcPEed4xr_rV2VdEgdjpRr0E",
  authDomain: "firestoreprojectbase.firebaseapp.com",
  projectId: "firestoreprojectbase",
  storageBucket: "firestoreprojectbase.firebasestorage.app",
  messagingSenderId: "229339290011",
  appId: "1:229339290011:web:20e09c107c2d0e9657693e",
  measurementId: "G-2QZHXGL72P"
};
const app = initializeApp(firebaseConfig);
try { getAnalytics(app); } catch(e) {}
const auth = getAuth(app), db = getFirestore(app);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid8 = () => Math.random().toString(36).slice(2, 10);
let user = null, accounts = [], unsub = null, mode = "login";

/* ---------- YOUR DATA (from your screenshots) – loaded automatically on first login ---------- */
const SEED = {
  "krishnasurya2011@gmail.com":[["MusicRoom","musicroom-c79d0"],["musicweb","musicweb-26987"],["webbook","webbook-fd668"],["siph","siph-2488b"],["athena","athena-7f2be"],["Finance tracker","finance-tracker-73854"],["RajaRaniGame","rajaranigame-e99fc"],["MusicSync","musicsync-5b5fe"]],
  "vv708539@gmail.com":[["Firestoreprojectbase","firestoreprojectbase"],["Project-record","project-record-d2dd9"],["siph","siph-9c695"],["Bookhub","bookhub-c4229"],["UNOpro","unopro-e0784"]],
  "willtolearnofficial@gmail.com":[["aptitude","aptitude-b1a1a"]],
  "csedept2b@gmail.com":[["Carrom","carrom-91970"],["Ludo","ludo-5e19f"],["UNOmax","unomax-ee541"]],
  "v.surya200629@gmail.com":[["attendance","attendance-dcade"],["LMS PORTAL","lms-portal-5ae0e"],["college","college-e1844"],["medcamp","medcamp-6a0f8"]],
  "susa2920ya@gmail.com":[["Barcode","barcode-71d84"],["collabcode","collabcode-3ad27"],["ChatbotFAQ","chatbotfaq-5d711"]]
};
async function autoSeed(u){
  const flag = doc(db,"users",u.uid,"meta","seeded");
  try{
    if ((await getDoc(flag)).exists()) return;
    let i = 0;
    for (const [email, ps] of Object.entries(SEED)) {
      await setDoc(doc(db,"users",u.uid,"accounts","seed-"+(i++)), {
        email, notes:"", createdAt:Date.now()+i,
        projects: ps.map(([name,id],k)=>({pid:"s"+i+"_"+k,name,id,note:""}))
      });
    }
    await setDoc(flag,{done:true,at:serverTimestamp()});
    toast("Loaded your 6 accounts and 21 projects");
  }catch(err){ toast("Could not load starter data: "+err.message); }
}

/* ---------- theme / toast ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch(e){}
$("#themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : !matchMedia("(prefers-color-scheme: light)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch(e){}
};
let tt;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2600); }

/* ---------- tabs ---------- */
function showTab(n){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===n));
  $("#dash").classList.toggle("hidden", n!=="dash");
  $("#accs").classList.toggle("hidden", n!=="accs");
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => showTab(b.dataset.tab));

/* ---------- auth ---------- */
function setMode(m){
  mode = m;
  $("#authBtn").textContent = m==="login" ? "Log in" : "Create account";
  $("#swTxt").textContent = m==="login" ? "New here?" : "Already registered?";
  $("#swLink").textContent = m==="login" ? "Create an account" : "Log in";
  $("#authErr").textContent = "";
}
$("#swLink").onclick = () => setMode(mode==="login" ? "signup" : "login");
const niceErr = e => ({
  "auth/invalid-credential":"Wrong email or password.","auth/email-already-in-use":"That email already has an account. Log in instead.",
  "auth/weak-password":"Use a password with at least 6 characters.","auth/invalid-email":"Enter a valid email address.",
  "auth/popup-closed-by-user":"Google sign-in was closed.","auth/operation-not-allowed":"Enable this sign-in method in Firebase Console → Authentication.",
  "auth/unauthorized-domain":"Add this domain in Firebase Console → Authentication → Settings → Authorized domains."
}[e.code] || e.message);
$("#authBtn").onclick = async () => {
  const em=$("#em").value.trim(), pw=$("#pw").value;
  if(!em||!pw){ $("#authErr").textContent="Enter your email and password."; return; }
  try{ mode==="login" ? await signInWithEmailAndPassword(auth,em,pw) : await createUserWithEmailAndPassword(auth,em,pw); }
  catch(e){ $("#authErr").textContent = niceErr(e); }
};
$("#pw").addEventListener("keydown", e => { if(e.key==="Enter") $("#authBtn").click(); });
$("#googleBtn").onclick = async () => {
  try{ await signInWithPopup(auth, new GoogleAuthProvider()); } catch(e){ $("#authErr").textContent = niceErr(e); }
};
$("#outBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async u => {
  user = u;
  if (unsub) { unsub(); unsub = null; }
  $("#auth").classList.toggle("hidden", !!u);
  $("#app").classList.toggle("hidden", !u);
  if (!u) { accounts = []; return; }
  $("#who").textContent = u.email || "";
  await autoSeed(u);
  unsub = onSnapshot(query(collection(db,"users",u.uid,"accounts"), orderBy("createdAt","asc")), snap => {
    accounts = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, err => toast(err.code==="permission-denied" ? "Permission denied – check your Firestore rules" : err.message));
});

/* ---------- render ---------- */
const hues = ["#ffb02e","#7dd3fc","#c4b5fd","#86efac","#fda4af","#fdba74","#5eead4","#f9a8d4"];
const colorFor = s => hues[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0) % hues.length];
$("#q").oninput = renderList;

function render(){ renderDash(); renderList(); }

function renderDash(){
  const total = accounts.reduce((n,a)=>n+(a.projects||[]).length,0);
  const top = [...accounts].sort((a,b)=>(b.projects||[]).length-(a.projects||[]).length)[0];
  const byName = {};
  accounts.forEach(a => (a.projects||[]).forEach(p => { const k=p.name.toLowerCase(); (byName[k]=byName[k]||[]).push({a:a.email,p}); }));
  const dups = Object.values(byName).filter(v=>v.length>1);
  $("#stats").innerHTML = `
    <div class="stat hl"><small>Total projects</small><b>${total}</b></div>
    <div class="stat"><small>Firebase accounts</small><b>${accounts.length}</b></div>
    <div class="stat"><small>Busiest account</small><b style="font-size:20px;margin-top:12px;word-break:break-all">${top?esc(top.email):"–"}</b><small>${top?(top.projects||[]).length+" projects":""}</small></div>
    <div class="stat"><small>Duplicate names</small><b>${dups.length}</b></div>`;
  const max = Math.max(1, ...accounts.map(a=>(a.projects||[]).length));
  $("#bars").innerHTML = accounts.map(a => { const n=(a.projects||[]).length; return `
    <div class="bar-row" data-jump="${a.id}" title="Open ${esc(a.email)}">
      <span>${esc(a.email)}</span>
      <div class="track"><div class="fill" style="width:${n/max*100}%;background:${colorFor(a.email)}"></div></div><b>${n}</b></div>`; }).join("") || `<span class="pill">No accounts yet</span>`;
  $("#dups").innerHTML = dups.map(v => `<div class="dup-item"><b>${esc(v[0].p.name)}</b>${v.map(x=>`<div>${esc(x.a)} → ${esc(x.p.id)}</div>`).join("")}</div>`).join("")
    || `<span class="pill">No duplicates</span>`;
  $("#chips").innerHTML = accounts.flatMap(a => (a.projects||[]).map(p =>
    `<span class="chip" title="${esc(a.email)}"><i style="background:${colorFor(a.email)}"></i>${esc(p.name)} <code>${esc(p.id)}</code></span>`)).join("")
    || `<span class="pill">Nothing yet</span>`;
}

function renderList(){
  const q = $("#q").value.trim().toLowerCase();
  const total = accounts.reduce((n,a)=>n+(a.projects||[]).length,0);
  $("#count").textContent = `${accounts.length} accounts · ${total} projects`;
  const list = $("#list");
  const shown = accounts.filter(a => !q || (a.email||"").toLowerCase().includes(q) || (a.notes||"").toLowerCase().includes(q) ||
    (a.projects||[]).some(p => (p.name+" "+p.id+" "+(p.note||"")).toLowerCase().includes(q)));
  if (!shown.length) {
    list.className = "";
    list.innerHTML = `<div class="empty"><h3>${accounts.length?"No matches":"No accounts yet"}</h3><p>${accounts.length?"Try a different search.":"Add a Firebase account to get started."}</p></div>`;
    return;
  }
  list.className = "grid";
  list.innerHTML = shown.map(a => {
    const ps = a.projects||[];
    return `<article class="acc" id="acc-${a.id}" data-id="${a.id}">
      <div class="acc-head">
        <div class="avatar" style="background:${colorFor(a.email)}">${esc((a.email||"?")[0].toUpperCase())}</div>
        <div class="t"><h3>${esc(a.email)}</h3><small>${ps.length} project${ps.length===1?"":"s"}</small></div>
        <div class="acc-actions">
          <button class="btn icon" data-act="edit-acc" title="Edit account" aria-label="Edit account">✎</button>
          <button class="btn icon danger" data-act="del-acc" title="Delete account" aria-label="Delete account">🗑</button>
        </div>
      </div>
      ${a.notes ? `<div class="note">${esc(a.notes)}</div>` : ""}
      <div class="projs">${ps.map(p => `
        <div class="proj" data-pid="${p.pid}">
          <div class="pi"><b>${esc(p.name)}</b><code>${esc(p.id)}</code>${p.note?`<div class="pn">${esc(p.note)}</div>`:""}</div>
          <div class="pa">
            <button class="btn icon" data-act="copy" title="Copy project ID" aria-label="Copy project ID">⧉</button>
            <a class="btn icon" href="https://console.firebase.google.com/project/${encodeURIComponent(p.id)}/overview?authuser=${encodeURIComponent(a.email)}" target="_blank" rel="noopener" title="Open in Firebase Console" aria-label="Open in console">↗</a>
            <button class="btn icon" data-act="edit-proj" title="Edit" aria-label="Edit project">✎</button>
            <button class="btn icon" data-act="del-proj" title="Delete" aria-label="Delete project">✕</button>
          </div>
        </div>`).join("") || `<span class="pill">No projects yet</span>`}
      </div>
      <button class="btn sm" data-act="add-proj">+ Add project</button>
    </article>`;
  }).join("");
}

/* ---------- modal ---------- */
const modal = $("#modal"), sheet = $("#sheet");
const open = html => { sheet.innerHTML = html; modal.classList.remove("hidden"); const i=sheet.querySelector("input"); i&&i.focus(); };
const close = () => modal.classList.add("hidden");
modal.addEventListener("mousedown", e => { if (e.target === modal) close(); });
addEventListener("keydown", e => { if (e.key==="Escape") close(); });

function accountForm(a){
  open(`<h3>${a?"Edit":"Add"} account</h3>
    <label for="f-em">Google account email</label><input id="f-em" type="email" value="${esc(a?.email)}" placeholder="name@gmail.com">
    <label for="f-no">Notes (optional)</label><textarea id="f-no" placeholder="e.g. college work, personal games…">${esc(a?.notes)}</textarea>
    <div class="row"><button class="btn" data-m="cancel">Cancel</button><button class="btn primary" data-m="save">Save</button></div>`);
  sheet.onclick = async e => {
    const m = e.target.dataset.m; if(!m) return;
    if (m==="cancel") return close();
    const email = $("#f-em").value.trim(), notes = $("#f-no").value.trim();
    if (!email) return toast("Enter the account email");
    const col = collection(db,"users",user.uid,"accounts");
    try {
      if (a) await updateDoc(doc(col,a.id), { email, notes });
      else await addDoc(col, { email, notes, projects:[], createdAt:Date.now() });
      close(); toast("Saved");
    } catch(err){ toast(err.message); }
  };
}
function projectForm(a, p){
  open(`<h3>${p?"Edit":"Add"} project</h3>
    <p style="color:var(--muted);font-size:13px;margin-top:4px">in ${esc(a.email)}</p>
    <label for="f-n">Project name</label><input id="f-n" value="${esc(p?.name)}" placeholder="MusicRoom">
    <label for="f-i">Project ID</label><input id="f-i" value="${esc(p?.id)}" placeholder="musicroom-c79d0">
    <label for="f-no">Note (optional)</label><input id="f-no" value="${esc(p?.note)}" placeholder="Hosting, Firestore, Auth…">
    <div class="row"><button class="btn" data-m="cancel">Cancel</button><button class="btn primary" data-m="save">Save</button></div>`);
  sheet.onclick = async e => {
    const m = e.target.dataset.m; if(!m) return;
    if (m==="cancel") return close();
    const name=$("#f-n").value.trim(), id=$("#f-i").value.trim(), note=$("#f-no").value.trim();
    if (!name || !id) return toast("Name and project ID are required");
    const projects = [...(a.projects||[])];
    if (p) { const i = projects.findIndex(x=>x.pid===p.pid); projects[i] = { pid:p.pid, name, id, note }; }
    else projects.push({ pid:uid8(), name, id, note });
    try { await updateDoc(doc(db,"users",user.uid,"accounts",a.id), { projects }); close(); toast("Saved"); }
    catch(err){ toast(err.message); }
  };
}
function confirmBox(text, onYes){
  open(`<h3>Are you sure?</h3><p style="color:var(--muted);margin-top:8px">${esc(text)}</p>
    <div class="row"><button class="btn" data-m="no">Cancel</button><button class="btn primary" data-m="yes" style="background:var(--danger);border-color:var(--danger);color:#fff">Delete</button></div>`);
  sheet.onclick = async e => { const m=e.target.dataset.m; if(m==="no") close(); if(m==="yes"){ await onYes(); close(); toast("Deleted"); } };
}

/* ---------- actions ---------- */
$("#addAcc").onclick = () => accountForm();
document.addEventListener("click", async e => {
  const jump = e.target.closest("[data-jump]");
  if (jump) {
    showTab("accs"); $("#q").value = ""; renderList();
    const el = document.getElementById("acc-"+jump.dataset.jump);
    if (el) { el.scrollIntoView({behavior:"smooth",block:"start"}); el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1600); }
    return;
  }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  const card = b.closest(".acc"); const a = accounts.find(x=>x.id===card?.dataset.id);
  if (!a) return;
  const pid = b.closest(".proj")?.dataset.pid; const p = (a.projects||[]).find(x=>x.pid===pid);
  if (act==="edit-acc") accountForm(a);
  if (act==="del-acc") confirmBox(`Delete ${a.email} and its ${(a.projects||[]).length} saved projects from this list? (The real Firebase projects are not touched.)`,
    () => deleteDoc(doc(db,"users",user.uid,"accounts",a.id)));
  if (act==="add-proj") projectForm(a);
  if (act==="edit-proj") projectForm(a,p);
  if (act==="del-proj") confirmBox(`Remove "${p.name}" from this list?`,
    () => updateDoc(doc(db,"users",user.uid,"accounts",a.id), { projects:a.projects.filter(x=>x.pid!==pid) }));
  if (act==="copy") { try{ await navigator.clipboard.writeText(p.id); toast("Project ID copied"); }catch(_){ toast("Copy failed"); } }
});
</script>
