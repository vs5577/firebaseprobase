<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebase Vault – which project lives where</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#eceff4;--muted:#8d95a6;
  --accent:#ffb02e;--accent-ink:#1a1200;--danger:#ff5d5d;--ok:#4ade80;--r:16px;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f5f3ee;--panel:#fff;--panel2:#f0ede6;--line:#e0dcd2;--text:#1c1d21;--muted:#6b6f7a;--accent-ink:#1a1200}
}
:root[data-theme="light"]{--bg:#f5f3ee;--panel:#fff;--panel2:#f0ede6;--line:#e0dcd2;--text:#1c1d21;--muted:#6b6f7a}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:15px/1.5 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;letter-spacing:-.02em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* buttons / fields */
.btn{border:1px solid var(--line);background:var(--panel2);padding:9px 16px;border-radius:12px;font-weight:600;transition:.15s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.icon{width:34px;height:34px;padding:0;border-radius:10px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:70px}

/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:410px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px 28px}
.auth-card h1{font-size:34px;line-height:1.05;margin-bottom:8px}
.auth-card p.sub{color:var(--muted);margin-bottom:6px}
.auth-card .btn{width:100%;margin-top:18px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:18px 0 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.switch{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
.switch a{color:var(--accent);cursor:pointer;font-weight:600}
.err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}

/* app */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;margin-right:auto;white-space:nowrap}
.logo span{color:var(--accent)}
.who{color:var(--muted);font-size:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1240px;margin:auto;padding:28px 20px 90px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between;margin-bottom:22px}
.top h2{font-size:clamp(26px,4vw,40px);line-height:1.05}
.top p{color:var(--muted);margin-top:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap;width:100%;max-width:560px}
.tools input{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:18px}
.acc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.acc-head{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;color:#10131a;font-size:18px}
.acc-head .t{flex:1;min-width:0}
.acc-head h3{font-size:16px;word-break:break-all;font-weight:700}
.acc-head small{color:var(--muted)}
.acc-actions{display:flex;gap:6px}
.note{color:var(--muted);font-size:13px;background:var(--panel2);padding:8px 12px;border-radius:10px}
.projs{display:flex;flex-direction:column;gap:8px}
.proj{background:var(--panel2);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.proj .pi{flex:1;min-width:0}
.proj b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj code{font-size:12.5px;color:var(--muted);word-break:break-all}
.proj .pn{font-size:12.5px;color:var(--muted);margin-top:2px}
.proj .pa{display:flex;gap:4px;flex:none}
.proj .btn.icon{width:30px;height:30px;border-radius:8px;background:transparent;border-color:transparent;color:var(--muted)}
.proj .btn.icon:hover{color:var(--text);border-color:var(--line)}
.empty{text-align:center;padding:60px 20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty h3{color:var(--text);font-size:22px;margin-bottom:6px}
.empty .btn{margin:16px 6px 0}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:2px 9px;border-radius:99px;white-space:nowrap}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px;width:100%;max-width:460px;padding:26px;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.sheet h3{font-size:22px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:99;transition:.25s;opacity:0;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:560px){.who{display:none}.bar{padding:12px 14px}main{padding:20px 14px 80px}.top .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- AUTH -->
<section id="auth">
  <div class="auth-card">
    <h1>Firebase<br>Vault</h1>
    <p class="sub">Keep track of which project lives in which Firebase account.</p>
    <button class="btn" id="googleBtn" type="button">Continue with Google</button>
    <div class="divider">or use email</div>
    <label for="em">Email</label><input id="em" type="email" autocomplete="email">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="authErr"></div>
    <button class="btn primary" id="authBtn" type="button">Log in</button>
    <div class="switch"><span id="swTxt">New here?</span> <a id="swLink" tabindex="0">Create an account</a></div>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header><div class="bar">
    <div class="logo">Firebase<span>Vault</span></div>
    <span class="who" id="who"></span>
    <button class="btn sm" id="themeBtn" type="button" title="Switch theme">Theme</button>
    <button class="btn sm" id="outBtn" type="button">Log out</button>
  </div></header>
  <main>
    <div class="top">
      <div><h2>Your Firebase accounts</h2><p id="stats"></p></div>
      <div class="tools">
        <input id="q" type="search" placeholder="Search account, project or ID…" aria-label="Search">
        <button class="btn primary" id="addAcc" type="button">+ Add account</button>
      </div>
    </div>
    <div id="list" class="grid"></div>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCU-DMS61iGcPEed4xr_rV2VdEgdjpRr0E",
  authDomain: "firestoreprojectbase.firebaseapp.com",
  projectId: "firestoreprojectbase",
  storageBucket: "firestoreprojectbase.firebasestorage.app",
  messagingSenderId: "229339290011",
  appId: "1:229339290011:web:20e09c107c2d0e9657693e",
  measurementId: "G-2QZHXGL72P"
};
const app = initializeApp(firebaseConfig);
try { getAnalytics(app); } catch(e) { /* analytics needs http(s); safe to ignore */ }
const auth = getAuth(app), db = getFirestore(app);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid8 = () => Math.random().toString(36).slice(2, 10);
let user = null, accounts = [], unsub = null, mode = "login";

/* ---------- theme ---------- */
const root = document.documentElement;
const savedTheme = (()=>{try{return localStorage.getItem("theme")}catch(e){return null}})();
if (savedTheme) root.dataset.theme = savedTheme;
$("#themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch(e) {}
};

/* ---------- toast ---------- */
let tt;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2000); }

/* ---------- auth ---------- */
function setMode(m){
  mode = m;
  $("#authBtn").textContent = m==="login" ? "Log in" : "Create account";
  $("#swTxt").textContent = m==="login" ? "New here?" : "Already registered?";
  $("#swLink").textContent = m==="login" ? "Create an account" : "Log in";
  $("#authErr").textContent = "";
}
$("#swLink").onclick = () => setMode(mode==="login" ? "signup" : "login");
const niceErr = e => ({
  "auth/invalid-credential":"Wrong email or password.","auth/email-already-in-use":"That email already has an account. Log in instead.",
  "auth/weak-password":"Use a password with at least 6 characters.","auth/invalid-email":"Enter a valid email address.",
  "auth/popup-closed-by-user":"Google sign-in was closed.","auth/operation-not-allowed":"Turn this sign-in method on in Firebase Console → Authentication.",
  "auth/unauthorized-domain":"Add this domain in Firebase Console → Authentication → Settings → Authorized domains."
}[e.code] || e.message);
$("#authBtn").onclick = async () => {
  const em=$("#em").value.trim(), pw=$("#pw").value;
  if(!em||!pw){ $("#authErr").textContent="Enter your email and password."; return; }
  try{ mode==="login" ? await signInWithEmailAndPassword(auth,em,pw) : await createUserWithEmailAndPassword(auth,em,pw); }
  catch(e){ $("#authErr").textContent = niceErr(e); }
};
$("#pw").addEventListener("keydown", e => { if(e.key==="Enter") $("#authBtn").click(); });
$("#googleBtn").onclick = async () => {
  try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ $("#authErr").textContent = niceErr(e); }
};
$("#outBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  user = u;
  if (unsub) { unsub(); unsub = null; }
  $("#auth").classList.toggle("hidden", !!u);
  $("#app").classList.toggle("hidden", !u);
  if (!u) { accounts = []; return; }
  $("#who").textContent = u.email || "";
  const col = collection(db, "users", u.uid, "accounts");
  unsub = onSnapshot(query(col, orderBy("createdAt","asc")), snap => {
    accounts = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, err => toast(err.code==="permission-denied" ? "Permission denied – check Firestore rules" : err.message));
});

/* ---------- render ---------- */
const hues = ["#ffb02e","#7dd3fc","#c4b5fd","#86efac","#fda4af","#fdba74","#5eead4"];
const colorFor = s => hues[[...s].reduce((a,c)=>a+c.charCodeAt(0),0) % hues.length];
$("#q").oninput = render;

function render(){
  const q = $("#q").value.trim().toLowerCase();
  const total = accounts.reduce((n,a)=>n+(a.projects||[]).length,0);
  $("#stats").textContent = `${accounts.length} account${accounts.length===1?"":"s"} · ${total} project${total===1?"":"s"}`;
  const list = $("#list");
  const shown = accounts.filter(a => !q || (a.email||"").toLowerCase().includes(q) || (a.notes||"").toLowerCase().includes(q) ||
    (a.projects||[]).some(p => (p.name+" "+p.id+" "+(p.note||"")).toLowerCase().includes(q)));
  if (!accounts.length) {
    list.className = "";
    list.innerHTML = `<div class="empty"><h3>Nothing saved yet</h3><p>Add a Firebase account, then list the projects inside it.</p>
      <button class="btn primary" data-act="add-acc">+ Add account</button>
      <button class="btn" data-act="seed">Import accounts from my screenshots</button></div>`;
    return;
  }
  list.className = "grid";
  if (!shown.length) { list.className=""; list.innerHTML = `<div class="empty"><h3>No matches</h3><p>Try a different search.</p></div>`; return; }
  list.innerHTML = shown.map(a => {
    const ps = (a.projects||[]);
    const c = colorFor(a.email||"?");
    return `<article class="acc" data-id="${a.id}">
      <div class="acc-head">
        <div class="avatar" style="background:${c}">${esc((a.email||"?")[0].toUpperCase())}</div>
        <div class="t"><h3>${esc(a.email)}</h3><small>${ps.length} project${ps.length===1?"":"s"}</small></div>
        <div class="acc-actions">
          <button class="btn icon" data-act="edit-acc" title="Edit account" aria-label="Edit account">✎</button>
          <button class="btn icon danger" data-act="del-acc" title="Delete account" aria-label="Delete account">🗑</button>
        </div>
      </div>
      ${a.notes ? `<div class="note">${esc(a.notes)}</div>` : ""}
      <div class="projs">${ps.map(p => `
        <div class="proj" data-pid="${p.pid}">
          <div class="pi"><b>${esc(p.name)}</b><code>${esc(p.id)}</code>${p.note?`<div class="pn">${esc(p.note)}</div>`:""}</div>
          <div class="pa">
            <button class="btn icon" data-act="copy" title="Copy project ID" aria-label="Copy project ID">⧉</button>
            <a class="btn icon" href="https://console.firebase.google.com/project/${encodeURIComponent(p.id)}/overview?authuser=${encodeURIComponent(a.email)}" target="_blank" rel="noopener" title="Open in Firebase Console" aria-label="Open in console">↗</a>
            <button class="btn icon" data-act="edit-proj" title="Edit" aria-label="Edit project">✎</button>
            <button class="btn icon" data-act="del-proj" title="Delete" aria-label="Delete project">✕</button>
          </div>
        </div>`).join("") || `<span class="pill">No projects yet</span>`}
      </div>
      <button class="btn sm" data-act="add-proj">+ Add project</button>
    </article>`;
  }).join("");
}

/* ---------- modal ---------- */
const modal = $("#modal"), sheet = $("#sheet");
const open = html => { sheet.innerHTML = html; modal.classList.remove("hidden"); const i=sheet.querySelector("input"); i&&i.focus(); };
const close = () => modal.classList.add("hidden");
modal.addEventListener("mousedown", e => { if (e.target === modal) close(); });
addEventListener("keydown", e => { if (e.key==="Escape") close(); });

function accountForm(a){
  open(`<h3>${a?"Edit":"Add"} account</h3>
    <label for="f-em">Google account email</label><input id="f-em" type="email" value="${esc(a?.email)}" placeholder="name@gmail.com">
    <label for="f-no">Notes (optional)</label><textarea id="f-no" placeholder="e.g. college work, personal games…">${esc(a?.notes)}</textarea>
    <div class="row"><button class="btn" data-m="cancel">Cancel</button><button class="btn primary" data-m="save">Save</button></div>`);
  sheet.onclick = async e => {
    const m = e.target.dataset.m; if(!m) return;
    if (m==="cancel") return close();
    const email = $("#f-em").value.trim(), notes = $("#f-no").value.trim();
    if (!email) return toast("Enter the account email");
    const col = collection(db,"users",user.uid,"accounts");
    try {
      if (a) await updateDoc(doc(col,a.id), { email, notes });
      else await addDoc(col, { email, notes, projects:[], createdAt:serverTimestamp() });
      close(); toast("Saved");
    } catch(err){ toast(err.message); }
  };
}
function projectForm(a, p){
  open(`<h3>${p?"Edit":"Add"} project</h3>
    <p style="color:var(--muted);font-size:13px;margin-top:4px">in ${esc(a.email)}</p>
    <label for="f-n">Project name</label><input id="f-n" value="${esc(p?.name)}" placeholder="MusicRoom">
    <label for="f-i">Project ID</label><input id="f-i" value="${esc(p?.id)}" placeholder="musicroom-c79d0">
    <label for="f-no">Note (optional)</label><input id="f-no" value="${esc(p?.note)}" placeholder="Hosting, Firestore, Auth…">
    <div class="row"><button class="btn" data-m="cancel">Cancel</button><button class="btn primary" data-m="save">Save</button></div>`);
  sheet.onclick = async e => {
    const m = e.target.dataset.m; if(!m) return;
    if (m==="cancel") return close();
    const name=$("#f-n").value.trim(), id=$("#f-i").value.trim(), note=$("#f-no").value.trim();
    if (!name || !id) return toast("Name and project ID are required");
    const projects = [...(a.projects||[])];
    if (p) { const i = projects.findIndex(x=>x.pid===p.pid); projects[i] = { pid:p.pid, name, id, note }; }
    else projects.push({ pid:uid8(), name, id, note });
    try { await updateDoc(doc(db,"users",user.uid,"accounts",a.id), { projects }); close(); toast("Saved"); }
    catch(err){ toast(err.message); }
  };
}
function confirmBox(text, onYes){
  open(`<h3>Are you sure?</h3><p style="color:var(--muted);margin-top:8px">${esc(text)}</p>
    <div class="row"><button class="btn" data-m="no">Cancel</button><button class="btn primary" data-m="yes" style="background:var(--danger);border-color:var(--danger);color:#fff">Delete</button></div>`);
  sheet.onclick = async e => { const m=e.target.dataset.m; if(m==="no") close(); if(m==="yes"){ await onYes(); close(); toast("Deleted"); } };
}

/* ---------- actions ---------- */
$("#addAcc").onclick = () => accountForm();
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  if (act==="add-acc") return accountForm();
  if (act==="seed") return seed();
  const card = b.closest(".acc"); const a = accounts.find(x=>x.id===card?.dataset.id);
  if (!a) return;
  const pid = b.closest(".proj")?.dataset.pid; const p = (a.projects||[]).find(x=>x.pid===pid);
  if (act==="edit-acc") accountForm(a);
  if (act==="del-acc") confirmBox(`Delete ${a.email} and all its ${(a.projects||[]).length} saved projects? (Only your note here is removed, not the real Firebase projects.)`,
    () => deleteDoc(doc(db,"users",user.uid,"accounts",a.id)));
  if (act==="add-proj") projectForm(a);
  if (act==="edit-proj") projectForm(a,p);
  if (act==="del-proj") confirmBox(`Remove "${p.name}" from this list?`,
    () => updateDoc(doc(db,"users",user.uid,"accounts",a.id), { projects:a.projects.filter(x=>x.pid!==pid) }));
  if (act==="copy") { try{ await navigator.clipboard.writeText(p.id); toast("Project ID copied"); }catch(_){ toast("Copy failed"); } }
});

/* ---------- one-click import from your screenshots ---------- */
const SEED = {
  "krishnasurya2011@gmail.com":[["MusicRoom","musicroom-c79d0"],["musicweb","musicweb-26987"],["webbook","webbook-fd668"],["siph","siph-2488b"],["athena","athena-7f2be"],["Finance tracker","finance-tracker-73854"],["RajaRaniGame","rajaranigame-e99fc"],["MusicSync","musicsync-5b5fe"]],
  "vv708539@gmail.com":[["Firestoreprojectbase","firestoreprojectbase"],["Project-record","project-record-d2dd9"],["siph","siph-9c695"],["Bookhub","bookhub-c4229"],["UNOpro","unopro-e0784"]],
  "willtolearnofficial@gmail.com":[["aptitude","aptitude-b1a1a"]],
  "csedept2b@gmail.com":[["Carrom","carrom-91970"],["Ludo","ludo-5e19f"],["UNOmax","unomax-ee541"]],
  "v.surya200629@gmail.com":[["attendance","attendance-dcade"],["LMS PORTAL","lms-portal-5ae0e"],["college","college-e1844"],["medcamp","medcamp-6a0f8"]],
  "susa2920ya@gmail.com":[["Barcode","barcode-71d84"],["collabcode","collabcode-3ad27"],["ChatbotFAQ","chatbotfaq-5d711"]]
};
async function seed(){
  const col = collection(db,"users",user.uid,"accounts");
  try{
    for (const [email, ps] of Object.entries(SEED))
      await addDoc(col, { email, notes:"", createdAt:serverTimestamp(), projects: ps.map(([name,id])=>({pid:uid8(),name,id,note:""})) });
    toast("Imported 6 accounts");
  }catch(err){ toast(err.message); }
}
</script>
</body>
</html>
